[package]
name = "oxideav-celt"
version = "0.1.12"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-celt"
authors = ["Mark Karpeles"]
description = "Pure-Rust CELT (MDCT path of Opus) — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-celt"
keywords = ["multimedia", "audio", "celt", "opus", "codec"]
categories = ["multimedia::encoding", "multimedia::audio"]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
# Round 454 (depth-mode benchmarks): Criterion drives the `decode`
# bench harness — a decode-throughput baseline (CBR streams the
# crate's own encoder emits + the concealment walk) for future
# decoder speed work to A/B against. Pinned to the same 0.5 line the
# other OxideAV crates with benches use.
criterion = "0.5"

# Criterion needs `harness = false` so its own main runs. Run with:
#     cargo bench --bench decode
[[bench]]
name = "decode"
harness = false
